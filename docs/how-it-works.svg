<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2b85a"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="998" height="438" rx="14" fill="#1e2433" stroke="#8a6d2f" stroke-width="2"/>

  <!-- 1: online together -->
  <text x="40" y="44" fill="#ffd25e" font-size="20" font-weight="700">When you're both online</text>
  <text x="40" y="68" fill="#aeb5c6" font-size="14">Nothing extra needed. Sterling syncs your quests live, in game.</text>

  <rect x="200" y="88" width="210" height="64" rx="10" fill="#2b3754" stroke="#6f8fc7" stroke-width="2"/>
  <text x="305" y="117" fill="#f1ede2" font-size="17" font-weight="700" text-anchor="middle">Your game</text>
  <text x="305" y="138" fill="#aeb5c6" font-size="13" text-anchor="middle">with Sterling</text>

  <rect x="590" y="88" width="210" height="64" rx="10" fill="#2b3754" stroke="#6f8fc7" stroke-width="2"/>
  <text x="695" y="117" fill="#f1ede2" font-size="17" font-weight="700" text-anchor="middle">Friend's game</text>
  <text x="695" y="138" fill="#aeb5c6" font-size="13" text-anchor="middle">with Sterling</text>

  <line x1="418" y1="120" x2="582" y2="120" stroke="#e2b85a" stroke-width="3" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="500" y="110" fill="#e2b85a" font-size="13" font-weight="600" text-anchor="middle">live sync</text>

  <!-- divider -->
  <line x1="40" y1="186" x2="960" y2="186" stroke="#3a4257" stroke-width="1.5"/>

  <!-- 2: different times -->
  <text x="40" y="226" fill="#ffd25e" font-size="20" font-weight="700">When you play at different times</text>
  <text x="40" y="250" fill="#aeb5c6" font-size="14">With the optional Sterling Quest Sync Companion app, your progress waits on the server until your friend logs in.</text>

  <!-- boxes: x = 30, 222, 414, 606, 798 ; width 172 -->
  <g font-size="13" text-anchor="middle">
    <rect x="20" y="278" width="160" height="78" rx="10" fill="#2b3754" stroke="#6f8fc7" stroke-width="2"/>
    <text x="100" y="309" fill="#f1ede2" font-size="16" font-weight="700">Your game</text>
    <text x="100" y="330" fill="#aeb5c6">saves your progress</text>
    <text x="100" y="346" fill="#aeb5c6">when you log out</text>

    <rect x="220" y="278" width="160" height="78" rx="10" fill="#26402f" stroke="#5fb072" stroke-width="2"/>
    <text x="300" y="309" fill="#f1ede2" font-size="16" font-weight="700">Companion app</text>
    <text x="300" y="330" fill="#aeb5c6">on your PC</text>
    <text x="300" y="346" fill="#aeb5c6">sends it up</text>

    <rect x="420" y="278" width="160" height="78" rx="10" fill="#3d3322" stroke="#e2b85a" stroke-width="2"/>
    <text x="500" y="309" fill="#f1ede2" font-size="16" font-weight="700">Sync server</text>
    <text x="500" y="330" fill="#aeb5c6">holds it for</text>
    <text x="500" y="346" fill="#aeb5c6">your friend</text>

    <rect x="620" y="278" width="160" height="78" rx="10" fill="#26402f" stroke="#5fb072" stroke-width="2"/>
    <text x="700" y="309" fill="#f1ede2" font-size="16" font-weight="700">Companion app</text>
    <text x="700" y="330" fill="#aeb5c6">on their PC</text>
    <text x="700" y="346" fill="#aeb5c6">brings it down</text>

    <rect x="820" y="278" width="160" height="78" rx="10" fill="#2b3754" stroke="#6f8fc7" stroke-width="2"/>
    <text x="900" y="309" fill="#f1ede2" font-size="16" font-weight="700">Friend's game</text>
    <text x="900" y="330" fill="#aeb5c6">loads it when</text>
    <text x="900" y="346" fill="#aeb5c6">they log in</text>
  </g>

  <g stroke="#e2b85a" stroke-width="3" marker-end="url(#arr)">
    <line x1="183" y1="317" x2="214" y2="317"/>
    <line x1="383" y1="317" x2="414" y2="317"/>
    <line x1="583" y1="317" x2="614" y2="317"/>
    <line x1="783" y1="317" x2="814" y2="317"/>
  </g>

  <text x="500" y="404" fill="#aeb5c6" font-size="14" text-anchor="middle">It works both ways: their progress reaches you the same way.</text>
</svg>
